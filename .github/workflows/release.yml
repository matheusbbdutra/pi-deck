name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex.: v0.1.7)"
        required: true

permissions:
  contents: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      # pinned: actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Dependências de sistema (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libappindicator3-dev \
            patchelf

      # pinned: dtolnay/rust-toolchain stable
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca

      # pinned: swatinem/rust-cache v2
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri

      - name: Testes
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Testes da UI
        run: |
          npm ci
          npm test

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      # pinned: actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Dependências de sistema (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libappindicator3-dev \
            patchelf

      # pinned: dtolnay/rust-toolchain stable
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          components: clippy

      # pinned: swatinem/rust-cache v2
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri

      - name: Clippy
        run: >
          cargo clippy
          --manifest-path src-tauri/Cargo.toml
          --all-targets -- -D warnings

  build:
    name: ${{ matrix.os }} ${{ matrix.target || '' }}
    needs: [test, clippy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --bundles deb,rpm,appimage
          - os: windows-latest
            args: --bundles msi,nsis
          - os: macos-latest
            args: --bundles app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --bundles app,dmg --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      # pinned: actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Dependências de sistema (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libappindicator3-dev \
            patchelf \
            rpm

      # pinned: actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      # pinned: dtolnay/rust-toolchain stable
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca

      - name: Alvo extra (macOS Intel)
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      # pinned: swatinem/rust-cache v2
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri
          key: ${{ matrix.target || 'native' }}

      - name: Instalar dependências
        run: npm ci

      - name: Build (sem publicar)
        run: npx tauri build ${{ matrix.args }}

      - name: Guardar bundles
        # pinned: actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.os }}-${{ matrix.target || 'native' }}
          if-no-files-found: error
          # Lista explícita: glob amplo pegava arquivos dentro do .app do macOS
          # (icon.icns) e as duas pernas macOS colidiam no upload.
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/*/release/bundle/deb/*.deb
            src-tauri/target/*/release/bundle/rpm/*.rpm
            src-tauri/target/*/release/bundle/appimage/*.AppImage
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.tar.gz

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest

    steps:
      # pinned: actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Baixar todos os bundles
        # pinned: actions/download-artifact v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Listar o que será publicado
        run: find dist -type f | sort

      - name: Criar/atualizar release (rascunho)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          Desktop client for the pi coding agent — sessions by project, live
          subagent runs, and a transcript that reads like documentation.

          ## Download

          | System | File |
          |---|---|
          | Debian / Ubuntu | `.deb` |
          | Fedora / RHEL | `.rpm` |
          | Any Linux | `.AppImage` |
          | Windows | `.exe` (NSIS) / `.msi` |
          | macOS Apple Silicon | `aarch64.dmg` |
          | macOS Intel | `x64.dmg` |

          ## Requirements

          - `pi` 1.4+ on `PATH` (the app never installs or updates pi)
          - Node.js 22+ (pi's runtime)
          - Linux: `libwebkit2gtk-4.1`, `libsoup-3.0`, `gtk+-3.0`, `librsvg2`

          ## Notes

          Binaries are **unsigned** — macOS Gatekeeper and Windows SmartScreen
          warn on first launch. Full changelog: CHANGELOG.md in the repo.
          NOTES

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --draft --title "pi-deck $TAG" --notes-file notes.md

          find dist -type f -print0 \
            | xargs -0 gh release upload "$TAG" \
                --repo "$GITHUB_REPOSITORY" --clobber
